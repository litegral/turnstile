apiVersion: apps/v1
kind: Deployment
metadata:
  name: turnstile
  labels:
    app.kubernetes.io/name: turnstile
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turnstile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turnstile
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/litegral/turnstile:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: turnstile-db
                  key: database-url
            - name: HTTP_ADDR
              value: :8080
            - name: LOG_LEVEL
              value: info
            # HPA maximum gives 5 replicas * 10 connections = 50 maximum app connections.
            - name: DB_MAX_CONNECTIONS
              value: "10"
            - name: DB_MIN_CONNECTIONS
              value: "1"
            - name: BOOKING_TIMEOUT
              value: 8s
            - name: WEBHOOK_TIMEOUT
              value: 8s
            - name: HTTP_WRITE_TIMEOUT
              value: 10s
            - name: SHUTDOWN_TIMEOUT
              value: 10s
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: turnstile
  labels:
    app.kubernetes.io/name: turnstile
spec:
  selector:
    app.kubernetes.io/name: turnstile
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turnstile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turnstile
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: turnstile
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turnstile
