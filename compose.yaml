services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnstile}
      POSTGRES_USER: ${POSTGRES_USER:-turnstile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnstile}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["migrate"]
    environment: &app-environment
      DATABASE_URL: host=postgres port=5432 user=${POSTGRES_USER:-turnstile} password=${POSTGRES_PASSWORD:-turnstile} dbname=${POSTGRES_DB:-turnstile} sslmode=disable
      HTTP_ADDR: ${HTTP_ADDR:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
      BOOKING_TIMEOUT: ${BOOKING_TIMEOUT:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-}
      DB_HEALTH_TIMEOUT: ${DB_HEALTH_TIMEOUT:-}
      ACCOUNTING_URL: ${ACCOUNTING_URL:-http://host.docker.internal:8081/transaction}
      ACCOUNTING_TIMEOUT: ${ACCOUNTING_TIMEOUT:-}
      ACCOUNTING_FAILURE_THRESHOLD: ${ACCOUNTING_FAILURE_THRESHOLD:-}
      ACCOUNTING_CIRCUIT_OPEN: ${ACCOUNTING_CIRCUIT_OPEN:-}
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-}
      OUTBOX_DELIVERY_TIMEOUT: ${OUTBOX_DELIVERY_TIMEOUT:-}
      OUTBOX_BASE_RETRY_DELAY: ${OUTBOX_BASE_RETRY_DELAY:-}
      OUTBOX_MAX_RETRY_DELAY: ${OUTBOX_MAX_RETRY_DELAY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  accounting:
    build: .
    entrypoint: ["mock-accounting"]
    environment:
      MOCK_ACCOUNTING_FAILURES: ${MOCK_ACCOUNTING_FAILURES:-2}
    ports:
      - "${ACCOUNTING_PORT:-8081}:8081"

  api:
    build: .
    environment:
      <<: *app-environment
      ACCOUNTING_URL: http://accounting:8081/transaction
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      accounting:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

volumes:
  postgres-data:
